name: japanese_learning_app
description: A Flutter app for Japanese language learning with AI teacher support.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2

  # Supabase
  supabase_flutter: ^2.5.0

  # Secure Storage
  flutter_secure_storage: ^9.2.0

  # Navigation
  go_router: ^14.0.0

  # State Management
  provider: ^6.1.0

  # HTTP Client
  dio: ^5.4.0

  # Environment Variables
  flutter_dotenv: ^5.1.0

  # Text to Speech
  flutter_tts: ^0.0.1

  # Recording
  record: ^5.1.1

  # Audio Service
  audio_service: ^0.18.12

  # Local Storage - SQLite
  sqflite: ^2.3.3+1
  path: ^1.8.3

  # Local Storage - Key-Value
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # RevenueCat
  purchases_flutter: ^7.8.5

  # Firebase Analytics
  firebase_core: ^2.24.0
  firebase_analytics: ^10.7.0

  # Error Tracking
  sentry_flutter: ^8.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - .env.local
    - .env
